name: Blood Arena • vérification
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    name: Validate static game and data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
